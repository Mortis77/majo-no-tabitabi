<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05060d; color: #f3ead8;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-user-select: none; user-select: none; }
  /* phones / tablets: no pull-to-refresh, no double-tap zoom, no long-press callouts or tap flashes */
  html, body { overscroll-behavior: none; touch-action: manipulation; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 1; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; background: linear-gradient(90deg,#172a3ed9,#20374678),url("assets/textures/journey/magic-country-title.webp") center / cover; z-index: 1000; transition: opacity .8s; }
  #boot.done { opacity: 0; pointer-events: none; }
  /* the title is up while the world loads: the backdrop stays, under the title, without its own ring / bar */
  #boot.under { z-index: 0; }
  #boot.under > * { visibility: hidden; }
  #boot .t { font-family: "Songti SC", "Hiragino Mincho ProN", "Noto Serif CJK SC", serif; font-size: 30px; letter-spacing: .5em; text-indent: .5em; }
  #boot .bar { width: 260px; height: 3px; background: rgba(255, 255, 255, .12); border-radius: 2px; overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 0%; background: #ffd98a; transition: width .25s; }
  #boot .s { font-size: 12px; opacity: .6; letter-spacing: .15em; min-height: 1.2em; }
  #fatal { position: fixed; left: 12px; right: 12px; bottom: 12px; max-height: 40%; overflow: auto; z-index: 2000; display: none;
    background: rgba(40, 8, 12, .92); color: #ffb4b4; font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 10px 14px;
    border: 1px solid #a33; border-radius: 6px; white-space: pre-wrap; pointer-events: auto; -webkit-user-select: text; user-select: text; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="ui"></div>
<div id="boot"><div class="t">魔女之旅</div><div class="bar"><i id="bootbar"></i></div><div class="s" id="bootmsg">正在翻开旅途手记……</div></div>
<div id="fatal"></div>
<script src="game.js"></script>
</body>
</html>
